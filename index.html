<script>
  // Apply the saved theme before first paint so no screen flashes the wrong theme.
  (function () { var t = 'dark'; try { t = localStorage.getItem('zedpark-theme') || 'dark'; } catch (e) {} document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); })();
</script>

<!-- LANDING -->
<section id="landing" class="landing" aria-label="Welcome">
  <div class="hero-media" aria-hidden="true">
    <img class="hero-still" src="assets/zedpark-poster.jpg" alt="">
    <video id="heroVideo" class="hero-video" muted loop playsinline preload="auto" poster="assets/zedpark-poster.jpg">
      <source src="assets/zedpark-hero.mp4" type="video/mp4">
    </video>
  </div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <header class="hero-top">
    <span class="brand brand-hero"><svg class="ic"><use href="#i-wheel"/></svg><span>ZED Park</span></span>
    <button class="icon-btn theme-toggle glassless" type="button" data-action="theme"><svg class="ic"><use href="#i-sun"/></svg><span class="sr">Switch theme</span></button>
  </header>
  <div class="hero-copy">
    <h1 class="hero-title">ZED Park <span class="hero-dash">—</span> <span class="hero-line">Your park at a glance</span></h1>
    <p class="hero-lede">Visitors, rides, revenue, utilities and the grounds — one calm view for the people who run the park.</p>
    <div class="hero-actions">
      <button class="btn btn-primary btn-lg" type="button" id="enterBtn">Enter Dashboard<svg class="ic"><use href="#i-arrow"/></svg></button>
      <span class="demo-tag"><svg class="ic"><use href="#i-database"/></svg>Demo data until systems are connected</span>
    </div>
  </div>
  <button class="hero-pp" type="button" id="heroPP" aria-pressed="false"><svg class="ic"><use href="#i-pause"/></svg><span class="pp-label">Pause video</span></button>
</section>

<!-- DASHBOARD -->
<div id="app" class="app" hidden>
  <aside class="side" aria-label="Dashboard sections">
    <button class="brand brand-side" type="button" data-action="home" aria-label="ZED Park — back to welcome screen"><svg class="ic"><use href="#i-wheel"/></svg><span>ZED Park</span></button>
    <nav><div class="tabs" role="tablist" aria-orientation="vertical" id="tabs"></div></nav>
    <div class="side-foot">
      <button class="src-btn" type="button" data-open="sources:all"><svg class="ic"><use href="#i-database"/></svg><span><b>Demo data</b><small>Not yet connected to live systems</small></span></button>
    </div>
  </aside>

  <div class="main-col">
    <header class="top">
      <div class="top-title">
        <button class="brand brand-mob" type="button" data-action="home" aria-label="ZED Park — back to welcome screen"><svg class="ic"><use href="#i-wheel"/></svg></button>
        <div>
          <h1 id="pageTitle">Overview</h1>
          <p class="top-meta" id="topMeta" aria-live="polite"></p>
        </div>
      </div>
      <div class="top-actions">
        <span class="badge-demo" data-tip="Figures are generated sample data, consistent across tabs, until live systems are connected."><svg class="ic"><use href="#i-database"/></svg>Demo data</span>
        <button class="icon-btn" type="button" data-action="refresh" aria-label="Refresh data"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn theme-toggle" type="button" data-action="theme"><svg class="ic"><use href="#i-sun"/></svg><span class="sr">Switch theme</span></button>
      </div>
    </header>
    <div class="mtabs" role="tablist" aria-label="Dashboard sections" id="mtabs"></div>
    <form class="filters" id="filters" aria-label="Filters" onsubmit="return false"></form>
    <main id="main" tabindex="-1"></main>
    <footer class="foot">Monitoring only — equipment controls are read-only by default. <span id="footStamp"></span></footer>
  </div>
</div>

<div class="rv-wrap" id="rideView" hidden>
  <div class="rv-scrim" data-action="rvclose"></div>
  <div class="rv" id="rv" role="dialog" aria-modal="true" aria-labelledby="rvTitle" tabindex="-1"></div>
</div>
<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="drawer-scrim" data-action="close"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1"></aside>
</div>
<div id="tip" class="tip" role="status" hidden></div>

</html>
